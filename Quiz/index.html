<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="quiz-container">
        <!-- Registration Screen -->
        <div id="registration-screen" class="screen active">
            <h1 style="color: #374151; font-weight: 700; margin-bottom: 5px;">Join the Quiz</h1>
            <p style="color: #9ca3af; font-size: 0.9rem; margin-bottom: 30px;">Enter your details to get started</p>
            <form id="registration-form" novalidate>
                <div class="form-group">
                    <label for="reg-name">FULL NAME</label>s
                    <input type="text" id="reg-name" required>
                    <span class="error-message" id="error-name"></span>
                </div>
                <div class="form-group">
                    <label for="reg-email">EMAIL ADDRESS</label>
                    <input type="email" id="reg-email" required>
                    <span class="error-message" id="error-email"></span>
                </div>
                <div class="form-group">
                    <label for="reg-mobile">MOBILE NUMBER</label>
                    <input type="tel" id="reg-mobile" required>
                    <span class="error-message" id="error-mobile"></span>
                </div>
                <button type="submit" id="submit-reg-btn" class="primary-btn" style="margin-top: 15px; text-transform: uppercase;">Start Quiz</button>
            </form>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="header">
                <div class="progress-info">
                    <span id="welcome-message" class="info-text" style="text-align: left;">Welcome, Sujal!</span>
                    <span class="info-text" style="text-align: center;">Score: <span id="current-score" style="font-weight: 700;">0</span></span>
                    <span class="info-text" style="text-align: right;">Time: <span id="time-left" class="timer-text">15</span>s</span>
                </div>
                <div class="progress-bar-container" style="margin-bottom: 20px;">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div class="question-counter-container" style="text-align: center; margin-bottom: 20px; font-size: 0.8rem; font-weight: 600; color: #9ca3af; letter-spacing: 0.5px; text-transform: uppercase;">
                    <span id="question-count">QUESTION 1/5</span>
                </div>
            </div>

            <div class="question-container">
                <h2 id="question-text" style="font-weight: 600;">Question text goes here?</h2>
                <div id="options-container" class="options-container">
                    <!-- Options will be injected here -->
                </div>
            </div>

            <button id="next-btn" class="primary-btn" disabled style="width: 100%; text-transform: uppercase; margin-top: 10px;">Next Question</button>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen">
            <h2 class="end-title" style="font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; color: #374151;">Quiz Completed!</h2>
            <div class="final-score-container" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
                <div class="score-display-large" style="font-size: 2.5rem; font-weight: 700; color: #6b72e1; line-height: 1.3; margin-bottom: 15px;">
                    <span id="user-final-message">Sujal, your score<br>is 4/5</span>
                </div>
                <div class="percentage-display" id="percentage-display" style="font-size: 1.2rem; font-weight: 600; color: #6b72e1; margin-bottom: 15px;">80%</div>
            </div>
            <p id="score-message" class="italic-message" style="font-style: italic; color: #9ca3af; font-size: 0.9rem; margin-bottom: 25px;">Keep Learning! You'll do better next time!</p>
            <div class="high-score-box" style="background-color: #f9fafb; border-left: 4px solid #6b72e1; padding: 15px; border-radius: 4px; font-weight: 600; font-size: 0.9rem; color: #374151; margin-bottom: 25px;">
                High Score: <span id="end-high-score">0</span>/<span id="total-points">5</span>
            </div>
            <button id="restart-btn" class="primary-btn" style="width: 100%; text-transform: uppercase;">Restart Quiz</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
